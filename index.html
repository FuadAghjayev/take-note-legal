<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Take Note — Legal</title>
<style>
  :root{--bg:#f6f6f7;--card:#fff;--fg:#141414;--muted:#5f5f66;--brand:#111111;--line:#e4e4e8}
  @media (prefers-color-scheme:dark){:root{--bg:#0f0f11;--card:#18181b;--fg:#ececef;--muted:#9a9aa3;--brand:#f2f2f4;--line:#26262b}}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:64px 20px}
  h1{font-size:1.8rem;margin:0 0 4px}
  .meta{color:var(--muted);margin:0 0 28px}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:10px 0;color:var(--fg);text-decoration:none}
  a.card:hover{border-color:var(--brand)}
  a.card b{display:block;color:var(--brand)}
  a.card span{color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Take Note</h1>
  <p class="meta">Legal documents for the Take Note mobile application.</p>
  <a class="card" href="about.html"><b>About Take Note</b><span>What the app does and who it is for.</span></a>
  <a class="card" href="privacy-policy.html"><b>Privacy Policy</b><span>What data we collect, why, and your rights.</span></a>
</div>

</html>
